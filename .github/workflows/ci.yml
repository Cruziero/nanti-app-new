name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-semantic-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node tests/semantic-understanding.cjs
      - run: npm run build
